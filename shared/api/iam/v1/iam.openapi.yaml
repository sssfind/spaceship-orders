openapi: 3.0.3
info:
  title: IAM Service API
  version: 1.0.0
  description: API регистрации и аутентификации пользователей

servers:
  - url: http://localhost:8082

x-ogen:
  package: iam
  target: ./shared/pkg/openapi/iam/v1

paths:
  /api/v1/auth/register:
    $ref: './paths/register.yaml'
  /api/v1/auth/login:
    $ref: './paths/login.yaml'
  /api/v1/auth/logout:
    $ref: './paths/logout.yaml'
  /api/v1/auth/whoami:
    $ref: './paths/whoami.yaml'
