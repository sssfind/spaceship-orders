get:
  summary: Текущий пользователь по сессии
  operationId: whoami
  parameters:
    - $ref: '../components/parameters/session_uuid_header.yaml'
  responses:
    '200':
      description: Пользователь сессии
      content:
        application/json:
          schema:
            $ref: '../components/user_dto.yaml'
    '401':
      description: Нет или неверная сессия
      content:
        application/json:
          schema:
            $ref: '../components/errors/unauthorized_error.yaml'
    '500':
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '../components/errors/internal_server_error.yaml'
