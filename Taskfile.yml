version: '3'

# Order service + shared/platform (OpenAPI, migrator, logger)
vars:
  GO_VERSION: '1.26'
  GOLANGCI_LINT_VERSION: 'v2.1.5'
  GCI_VERSION: 'v0.13.6'
  GOFUMPT_VERSION: 'v0.8.0'
  OGEN_VERSION: 'v1.12.0'
  YQ_VERSION: 'v4.45.2'
  MOCKERY_VERSION: 'v2.53.3'
  ENVSUBST_VERSION: 'v1.4.3'
  GOOSE_VERSION: 'v3.27.2'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  OGEN: '{{.BIN_DIR}}/ogen'
  YQ: '{{.BIN_DIR}}/yq'
  MOCKERY: "{{.BIN_DIR}}/mockery"
  ENVSUBST: '{{.BIN_DIR}}/envsubst'
  GOOSE: '{{.BIN_DIR}}/goose'
  ENVDIR: '{{.ROOT_DIR}}/deploy/env'
  COMPOSE_ORDER_ENV: '{{.ROOT_DIR}}/deploy/compose/order/.env'

  NODE_MODULES_DIR: '{{.ROOT_DIR}}/node_modules/.bin'
  REDOCLY: '{{.NODE_MODULES_DIR}}/redocly'

  OPEN_API_ORDER_V1_BASE: '{{.ROOT_DIR}}/shared/api/orders/v1/orders.openapi.yaml'
  OPEN_API_ORDER_V1_BUNDLE: '{{.ROOT_DIR}}/shared/api/bundles/orders.api.v1.bundle.yaml'
  OPEN_API_IAM_V1_BASE: '{{.ROOT_DIR}}/shared/api/iam/v1/iam.openapi.yaml'
  OPEN_API_IAM_V1_BUNDLE: '{{.ROOT_DIR}}/shared/api/bundles/iam.api.v1.bundle.yaml'
  OPEN_API_FILES: '{{.ROOT_DIR}}/shared/api/bundles'
  COVERAGE_DIR: '{{.ROOT_DIR}}/coverage'
  COVERAGE_FILE: total.out
  ORDER_MIGRATIONS_DIR: '{{.ROOT_DIR}}/order/migrations'
  IAM_MIGRATIONS_DIR: '{{.ROOT_DIR}}/iam/migrations'
  COMPOSE_IAM_ENV: '{{.ROOT_DIR}}/deploy/compose/iam/.env'

  MODULES: order iam shared platform
  SERVICES: order,iam

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует Go-код (order, shared, platform), исключая mocks"
    deps: [ install-formatters ]
    cmds:
      - |
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🧼 gofumpt: $module"
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
          fi
        done
      - |
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🎯 gci: $module"
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(spaceship-orders)" {} +
          fi
        done

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в ./bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "golangci-lint для order, shared, platform"
    deps: [ install-golangci-lint ]
    cmds:
      - |
        set -e
        ERR=0
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            {{.GOLANGCI_LINT}} run $mod/... --config=.golangci.yml || ERR=1
          fi
        done
        exit $ERR

  redocly-cli:install:
    desc: "Установить Redocly CLI (npm ci)"
    cmds:
      - |
        [ -f {{.REDOCLY}} ] || npm ci

  redocly-cli:order-v1-bundle:
    desc: "Собрать OpenAPI Order v1 в bundle"
    deps: [ redocly-cli:install ]
    cmds:
      - '{{.REDOCLY}} bundle {{.OPEN_API_ORDER_V1_BASE}} -o {{.OPEN_API_ORDER_V1_BUNDLE}}'

  redocly-cli:iam-v1-bundle:
    desc: "Собрать OpenAPI IAM v1 в bundle"
    deps: [ redocly-cli:install ]
    cmds:
      - '{{.REDOCLY}} bundle {{.OPEN_API_IAM_V1_BASE}} -o {{.OPEN_API_IAM_V1_BUNDLE}}'

  ogen:install:
    desc: "Установить ogen в ./bin"
    cmds:
      - |
        [ -f {{.OGEN}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
        }

  yq:install:
    desc: "Установить yq в ./bin"
    cmds:
      - |
        [ -f {{.YQ}} ] || {
          GOBIN={{.BIN_DIR}} go install github.com/mikefarah/yq/v4@{{.YQ_VERSION}}
        }

  ogen:gen:
    desc: "Генерация HTTP-серверов Order/IAM из OpenAPI (ogen)"
    deps: [ ogen:install, yq:install ]
    cmds:
      - task: redocly-cli:order-v1-bundle
      - task: redocly-cli:iam-v1-bundle
      - |
        find {{.OPEN_API_FILES}} -name '*.yaml' -o -name '*.yml' | while read -r file; do
          if [ -f "$file" ] && grep -q 'x-ogen:' "$file"; then
            echo "🚀 ogen: $file"
            target=$({{.YQ}} e '."x-ogen".target' "$file")
            package=$({{.YQ}} e '."x-ogen".package' "$file")
            {{.OGEN}} --target "$target" --package "$package" --clean "$file" || exit 1
          fi
        done

  gen:
    desc: "Перегенерировать Go-код из OpenAPI (Order + IAM)"
    cmds:
      - task: ogen:gen

  deps:update:
    desc: "go mod tidy в order, iam, shared, platform"
    cmds:
      - |
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            echo "🔄 $mod"
            (cd "$mod" && go mod tidy -compat={{.GO_VERSION}}) || exit 1
          fi
        done

  mockery:install:
    desc: "Установить mockery в ./bin"
    cmds:
      - |
        [ -f {{.MOCKERY}} ] || {
          GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
        }
    status:
      - test -x {{.MOCKERY}}

  mockery:gen:
    desc: "Генерация моков (order config/repository)"
    deps: [ mockery:install ]
    cmds:
      - '{{.MOCKERY}}'

  test:
    desc: "Юнит-тесты order (без integration)"
    cmds:
      - |
        go test -v -tags="!integration" \
          $(go list ./order/... | grep -v -E '(/tests/integration)')

  test-coverage:
    desc: "Покрытие service/repository в order"
    cmds:
      - |
        rm -rf {{.COVERAGE_DIR}}
        mkdir -p {{.COVERAGE_DIR}}
        TARGET_PKGS=$(go list ./order/... \
          | grep -E '/(internal/(service|repository))' \
          | grep -v mocks \
          | paste -sd "," -)
        if [ -z "$TARGET_PKGS" ]; then
          echo "⚠️ Нет пакетов для покрытия"
          exit 0
        fi
        go test -coverpkg="$TARGET_PKGS" \
          -coverprofile={{.COVERAGE_DIR}}/order.out \
          -covermode=atomic \
          $(echo "$TARGET_PKGS" | tr "," " ")
        go tool cover -func={{.COVERAGE_DIR}}/order.out | tail -n1

  coverage:html:
    desc: "HTML-отчёт покрытия order"
    deps: [ test-coverage ]
    cmds:
      - go tool cover -html={{.COVERAGE_DIR}}/order.out -o {{.COVERAGE_DIR}}/coverage.html

  test-integration:
    desc: "Интеграционные тесты order (Docker + Postgres)"
    cmds:
      - go test -v -tags=integration ./order/tests/integration/...

  up-order:
    desc: "Docker Compose: Postgres + Order"
    dir: deploy/compose/order
    cmds:
      - docker compose up --build --detach

  down-order:
    desc: "Остановить Order compose"
    dir: deploy/compose/order
    cmds:
      - docker compose down --volumes

  up-iam:
    desc: "Docker Compose: Postgres + IAM"
    dir: deploy/compose/iam
    cmds:
      - docker compose up --build --detach

  down-iam:
    desc: "Остановить IAM compose"
    dir: deploy/compose/iam
    cmds:
      - docker compose down --volumes

  up:
    desc: "Поднять IAM + Order (общая сеть spaceship_network)"
    cmds:
      - docker network inspect spaceship_network >/dev/null 2>&1 || docker network create spaceship_network
      - task: env:generate
      - task: up-iam
      - task: up-order

  down:
    desc: "Остановить Order + IAM"
    cmds:
      - task: down-order
      - task: down-iam

  env:install-envsubst:
    desc: "Установить envsubst в ./bin"
    cmds:
      - |
        [ -f {{.ENVSUBST}} ] || {
          GOBIN={{.BIN_DIR}} go install github.com/a8m/envsubst/cmd/envsubst@{{.ENVSUBST_VERSION}}
        }

  env:generate:
    desc: "Сгенерировать deploy/compose/*/ .env для Order и IAM"
    deps: [ env:install-envsubst ]
    cmds:
      - |
        ENV_FILE="{{.ENVDIR}}/.env"
        TEMPLATE_FILE="{{.ENVDIR}}/.env.template"
        SCRIPT="{{.ENVDIR}}/generate-env.sh"
        if [ ! -f "$ENV_FILE" ] && [ -f "$TEMPLATE_FILE" ]; then
          cp "$TEMPLATE_FILE" "$ENV_FILE"
        fi
        # Обновляем .env мастер-файл из шаблона, если в нём ещё старые IAM_GRPC/REDIS ключи
        if [ -f "$ENV_FILE" ] && grep -q 'IAM_GRPC_HOST\|IAM_REDIS_HOST' "$ENV_FILE" 2>/dev/null; then
          echo "♻️  Обновляем {{.ENVDIR}}/.env из .env.template (HTTP IAM без Redis)"
          cp "$TEMPLATE_FILE" "$ENV_FILE"
        fi
        chmod +x "$SCRIPT"
        export SERVICES="{{.SERVICES}}"
        ENV_SUBST={{.ENVSUBST}} "$SCRIPT"

  goose:install:
    desc: "Установить goose CLI в ./bin"
    cmds:
      - |
        [ -f {{.GOOSE}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
        }
    status:
      - test -x {{.GOOSE}}

  migrate:
    desc: "One-off: применить goose-миграции Order к PostgreSQL (с хоста)"
    deps: [ goose:install, env:generate ]
    cmds:
      - |
        set -euo pipefail
        ENV_FILE="{{.COMPOSE_ORDER_ENV}}"
        if [ ! -f "$ENV_FILE" ]; then
          echo "❌ Нет $ENV_FILE — сначала: task env:generate"
          exit 1
        fi
        set -a
        # shellcheck disable=SC1090
        source "$ENV_FILE"
        set +a
        HOST="${POSTGRES_HOST_EXTERNAL:-localhost}"
        PORT="${EXTERNAL_POSTGRES_PORT:-5432}"
        SSLMODE="${POSTGRES_SSL_MODE:-disable}"
        DSN="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HOST}:${PORT}/${POSTGRES_DB}?sslmode=${SSLMODE}"
        echo "🚀 goose up → ${HOST}:${PORT}/${POSTGRES_DB}"
        {{.GOOSE}} -dir "{{.ORDER_MIGRATIONS_DIR}}" postgres "$DSN" up

  migrate:status:
    desc: "Статус goose-миграций Order"
    deps: [ goose:install, env:generate ]
    cmds:
      - |
        set -euo pipefail
        ENV_FILE="{{.COMPOSE_ORDER_ENV}}"
        set -a
        # shellcheck disable=SC1090
        source "$ENV_FILE"
        set +a
        HOST="${POSTGRES_HOST_EXTERNAL:-localhost}"
        PORT="${EXTERNAL_POSTGRES_PORT:-5432}"
        SSLMODE="${POSTGRES_SSL_MODE:-disable}"
        DSN="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HOST}:${PORT}/${POSTGRES_DB}?sslmode=${SSLMODE}"
        {{.GOOSE}} -dir "{{.ORDER_MIGRATIONS_DIR}}" postgres "$DSN" status

  migrate:down:
    desc: "One-off: откатить последнюю goose-миграцию Order"
    deps: [ goose:install, env:generate ]
    cmds:
      - |
        set -euo pipefail
        ENV_FILE="{{.COMPOSE_ORDER_ENV}}"
        set -a
        # shellcheck disable=SC1090
        source "$ENV_FILE"
        set +a
        HOST="${POSTGRES_HOST_EXTERNAL:-localhost}"
        PORT="${EXTERNAL_POSTGRES_PORT:-5432}"
        SSLMODE="${POSTGRES_SSL_MODE:-disable}"
        DSN="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${HOST}:${PORT}/${POSTGRES_DB}?sslmode=${SSLMODE}"
        echo "⏪ goose down → ${HOST}:${PORT}/${POSTGRES_DB}"
        {{.GOOSE}} -dir "{{.ORDER_MIGRATIONS_DIR}}" postgres "$DSN" down

  run:
    desc: "Запуск Order локально (нужен Postgres, IAM и .env)"
    deps: [env:generate]
    dir: order
    cmds:
      - go run ./cmd

  run-iam:
    desc: "Запуск IAM локально (нужен Postgres и .env)"
    deps: [env:generate]
    dir: iam
    cmds:
      - go run ./cmd
