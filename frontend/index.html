<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spaceship Orders</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <span class="header__mark">◆</span>
      <h1>Spaceship Orders</h1>
    </div>
    <p class="header__sub">Управление заказами космических кораблей</p>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Создать заказ</h2>
      <form id="create-form" class="form">
        <label>
          User UUID
          <input
            id="user-uuid"
            name="user_uuid"
            type="text"
            required
            placeholder="11111111-1111-1111-1111-111111111111"
            value="11111111-1111-1111-1111-111111111111"
          />
        </label>
        <label>
          Part UUIDs (по одному в строке)
          <textarea
            id="part-uuids"
            name="part_uuids"
            rows="3"
            required
            placeholder="22222222-2222-2222-2222-222222222222"
          >22222222-2222-2222-2222-222222222222</textarea>
        </label>
        <button type="submit" class="btn btn--primary">Создать</button>
      </form>
    </section>

    <section class="panel panel--wide">
      <div class="panel__head">
        <h2>Заказы</h2>
        <button type="button" id="refresh-btn" class="btn btn--ghost">Обновить</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order UUID</th>
              <th>User</th>
              <th>Цена</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr>
              <td colspan="5" class="empty">Загрузка…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="pay-dialog">
    <form method="dialog" id="pay-form" class="form">
      <h3>Оплата заказа</h3>
      <p id="pay-order-id" class="muted"></p>
      <label>
        Способ оплаты
        <select id="payment-method" name="payment_method" required>
          <option value="CARD">CARD</option>
          <option value="SBP">SBP</option>
          <option value="CREDIT_CARD">CREDIT_CARD</option>
          <option value="INVESTOR_MONEY">INVESTOR_MONEY</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn--ghost">Отмена</button>
        <button type="submit" value="confirm" class="btn btn--primary">Оплатить</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
