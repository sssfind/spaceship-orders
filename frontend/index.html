<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spaceship Orders</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <span class="header__mark">◆</span>
      <h1>Spaceship Orders</h1>
    </div>
    <p class="header__sub">Управление заказами космических кораблей</p>
    <div id="auth-bar" class="auth-bar hidden">
      <span id="auth-user" class="auth-bar__user"></span>
      <button type="button" id="logout-btn" class="btn btn--ghost btn--sm">Выйти</button>
    </div>
  </header>

  <main class="layout">
    <section id="auth-panel" class="panel">
      <h2>Вход</h2>
      <form id="auth-form" class="form">
        <label>
          Логин
          <input id="auth-login" name="login" type="text" required minlength="3" autocomplete="username" />
        </label>
        <label>
          Пароль
          <input id="auth-password" name="password" type="password" required minlength="6" autocomplete="current-password" />
        </label>
        <div class="auth-actions">
          <button type="submit" name="action" value="login" class="btn btn--primary">Войти</button>
          <button type="submit" name="action" value="register" class="btn btn--ghost">Регистрация</button>
        </div>
      </form>
      <div id="auth-status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="app-panel" class="app-panel hidden">
      <section class="panel panel--wide">
        <div class="panel__head">
          <h2>Каталог деталей</h2>
          <button type="button" id="parts-refresh-btn" class="btn btn--ghost">Обновить</button>
        </div>
        <div id="parts-status" class="status" role="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>Название</th>
                <th>Категория</th>
                <th>Цена</th>
                <th>Склад</th>
                <th>UUID</th>
              </tr>
            </thead>
            <tbody id="parts-body">
              <tr>
                <td colspan="6" class="empty">Загрузка…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <form id="create-part-form" class="form form--inline">
          <label>
            Название
            <input id="part-name" name="name" type="text" required maxlength="128" />
          </label>
          <label>
            Цена
            <input id="part-price" name="price" type="number" min="0" step="0.01" required />
          </label>
          <label>
            Категория
            <input id="part-category" name="category" type="text" value="GENERAL" maxlength="64" />
          </label>
          <label>
            Склад
            <input id="part-stock" name="in_stock" type="number" min="0" step="1" value="10" />
          </label>
          <button type="submit" class="btn btn--ghost">Добавить деталь</button>
        </form>
      </section>

      <section class="panel">
        <h2>Создать заказ</h2>
        <p class="muted">Отметьте детали в каталоге и нажмите «Создать».</p>
        <form id="create-form" class="form">
          <button type="submit" class="btn btn--primary">Создать заказ из выбранных</button>
        </form>
      </section>

      <section class="panel panel--wide">
        <div class="panel__head">
          <h2>Заказы</h2>
          <button type="button" id="refresh-btn" class="btn btn--ghost">Обновить</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order UUID</th>
                <th>User</th>
                <th>Цена</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr>
                <td colspan="5" class="empty">Загрузка…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <dialog id="pay-dialog">
    <form method="dialog" id="pay-form" class="form">
      <h3>Оплата заказа</h3>
      <p id="pay-order-id" class="muted"></p>
      <label>
        Способ оплаты
        <select id="payment-method" name="payment_method" required>
          <option value="CARD">CARD</option>
          <option value="SBP">SBP</option>
          <option value="CREDIT_CARD">CREDIT_CARD</option>
          <option value="INVESTOR_MONEY">INVESTOR_MONEY</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn--ghost">Отмена</button>
        <button type="submit" value="confirm" class="btn btn--primary">Оплатить</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
