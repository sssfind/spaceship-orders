# Victoria Logs (single-node). Логи хранятся на PVC; снаружи — kubectl port-forward.
# kubectl -n spaceship port-forward svc/victoria-logs 9428:9428
# UI: http://localhost:9428/select/vmui  (также работает /vmui/)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs
  namespace: spaceship
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: spaceship-orders
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: spaceship
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: spaceship-orders
spec:
  replicas: 1
  # Recreate: при обновлении старый под отпускает PVC до старта нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/part-of: spaceship-orders
    spec:
      # Образ distroless, не root. fsGroup даёт поду писать в PVC.
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=7d
            - -httpListenAddr=:9428
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: data
              mountPath: /storage
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: spaceship
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: spaceship-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
