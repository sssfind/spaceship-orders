# kubectl -n spaceship port-forward svc/grafana 3000:3000
# UI: http://localhost:3000  (admin / admin) - Explore - VictoriaLogs
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: spaceship
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: spaceship-orders
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs:9428
        isDefault: true
        jsonData:
          otelPreset:
            enabled: true
            detection:
              severity:
                field: severity_text
                valueCase: string
                source: manual
          logLevelRules:
            - field: severity_text
              value: debug
              level: debug
              operator: equals
              enabled: true
            - field: severity_text
              value: info
              level: info
              operator: equals
              enabled: true
            - field: severity_text
              value: warn
              level: warning
              operator: equals
              enabled: true
            - field: severity_text
              value: warning
              level: warning
              operator: equals
              enabled: true
            - field: severity_text
              value: error
              level: error
              operator: equals
              enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: spaceship
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: spaceship-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: spaceship-orders
    spec:
      securityContext:
        fsGroup: 472
      initContainers:
        - name: wait-for-victoria-logs
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z victoria-logs 9428; do echo "waiting for victoria-logs"; sleep 2; done
      containers:
        - name: grafana
          image: grafana/grafana:11.6.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: victoriametrics-logs-datasource
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
      volumes:
        - name: datasources
          configMap:
            name: grafana
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: spaceship
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: spaceship-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
