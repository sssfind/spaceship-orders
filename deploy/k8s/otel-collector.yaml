# OpenTelemetry Collector: OTLP/gRPC от Order/IAM → OTLP/HTTP в Victoria Logs.
# VL принимает OpenTelemetry только по HTTP (/insert/opentelemetry/v1/logs), не gRPC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: spaceship
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: spaceship-orders
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlphttp/victorialogs:
        logs_endpoint: http://victoria-logs:9428/insert/opentelemetry/v1/logs
        compression: gzip
        encoding: proto
        tls:
          insecure: true
      debug:
        verbosity: basic
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/victorialogs, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: spaceship
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: spaceship-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: spaceship-orders
    spec:
      initContainers:
        - name: wait-for-victoria-logs
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z victoria-logs 9428; do echo "waiting for victoria-logs"; sleep 2; done
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.128.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: collector.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: spaceship
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: spaceship-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
