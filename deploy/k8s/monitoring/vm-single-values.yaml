# Helm: vm/victoria-metrics-single
# helm upgrade --install vm-single vm/victoria-metrics-single -n monitoring --create-namespace -f deploy/k8s/monitoring/vm-single-values.yaml
#
# Не меняйте persistentVolume.size у уже созданного StatefulSet — поле immutable.
server:
  scrape:
    enabled: true
    config:
      global:
        scrape_interval: 15s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
        - job_name: blackbox-health
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
                - http://order.spaceship.svc.cluster.local:8081/health
                - http://iam.spaceship.svc.cluster.local:8082/health
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox.spaceship.svc.cluster.local:9115
