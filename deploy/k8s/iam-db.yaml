# Postgres для IAM. Отдельная БД, как в Docker Compose (iam_db / iam).
apiVersion: v1
kind: Secret
metadata:
  name: iam-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam-db
    app.kubernetes.io/part-of: spaceship-orders
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: iam
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iam-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam-db
    app.kubernetes.io/part-of: spaceship-orders
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam-db
    app.kubernetes.io/part-of: spaceship-orders
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: iam-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam-db
        app.kubernetes.io/part-of: spaceship-orders
    spec:
      containers:
        - name: postgres
          image: postgres:17.0-alpine3.20
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: iam-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "iam"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "iam"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iam-db
---
apiVersion: v1
kind: Service
metadata:
  name: iam-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam-db
    app.kubernetes.io/part-of: spaceship-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iam-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
