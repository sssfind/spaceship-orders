# Postgres для Order. Одна реплика: том ReadWriteOnce нельзя смонтировать в несколько подов.
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/part-of: spaceship-orders
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: orders
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/part-of: spaceship-orders
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/part-of: spaceship-orders
spec:
  replicas: 1
  # Recreate: при обновлении старый под отпускает PVC до старта нового.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-db
        app.kubernetes.io/part-of: spaceship-orders
    spec:
      containers:
        - name: postgres
          image: postgres:17.0-alpine3.20
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: orders-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "orders"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "orders"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orders-db
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: spaceship
  labels:
    app.kubernetes.io/name: orders-db
    app.kubernetes.io/part-of: spaceship-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
