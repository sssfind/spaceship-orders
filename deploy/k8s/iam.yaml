# IAM: регистрация, логин, сессии. Снаружи кластера не публикуется — UI ходит через Order.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iam
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: spaceship-orders
data:
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8082"
  HTTP_READ_TIMEOUT: "5s"
  LOGGER_LEVEL: info
  LOGGER_AS_JSON: "false"
  LOG_OUTPUTS: stdout
  SERVICE_NAME: iam-service
  POSTGRES_HOST: iam-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: iam
  POSTGRES_SSL_MODE: disable
  MIGRATION_DIRECTORY: migrations
  SESSION_TTL: 24h
---
apiVersion: v1
kind: Secret
metadata:
  name: iam
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: spaceship-orders
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: spaceship-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iam
        app.kubernetes.io/part-of: spaceship-orders
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z iam-db 5432; do echo "waiting for iam-db"; sleep 2; done
      containers:
        - name: iam
          image: iam:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: iam
            - secretRef:
                name: iam
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  namespace: spaceship
  labels:
    app.kubernetes.io/name: iam
    app.kubernetes.io/part-of: spaceship-orders
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iam
  ports:
    - name: http
      port: 8082
      targetPort: http
