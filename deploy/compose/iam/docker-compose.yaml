services:
  iam_db:
    image: postgres:17.0-alpine3.20
    container_name: iam_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    networks:
      - spaceship_network
    volumes:
      - iam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  iam_app:
    image: iam:latest
    container_name: iam_service
    build:
      context: ../../../
      dockerfile: deploy/docker/iam/Dockerfile
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    env_file:
      - .env
    networks:
      - spaceship_network
    depends_on:
      iam_db:
        condition: service_healthy

volumes:
  iam_pg_data:

networks:
  spaceship_network:
    external: true
    name: spaceship_network
