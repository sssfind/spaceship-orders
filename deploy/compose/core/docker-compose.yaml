services:
  # === Брокер сообщений Kafka ===
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/${KAFKA_INTERNAL_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - spaceship_network

  # === Панель управления Kafka UI ===
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - spaceship_network

  # === OpenTelemetry Collector ===
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../../otel/collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Elasticsearch ===
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Kibana ===
  kibana:
    image: elastic/kibana:8.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Jaeger ===
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    ports:
      - "16686:16686" # UI
      - "14250:14250"
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Prometheus ===
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Grafana ===
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ../../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ../../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ../../grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Сервис Оплаты ===
  payment_app:
    image: payment:latest
    container_name: payment_service
    build:
      context: ../../../
      dockerfile: deploy/docker/payment/Dockerfile
    ports:
      - "50052:50052"
    env_file:
      - ../payment/.env
    environment:
      - GRPC_HOST=0.0.0.0
    networks:
      - spaceship_network
    restart: unless-stopped

  # === Сервис Сборки Кораблей (Assembly) ===
  assembly_app:
    image: assembly:latest
    container_name: assembly_service
    build:
      context: ../../../
      dockerfile: deploy/docker/assembly/Dockerfile
    env_file:
      - ../assembly/.env
    ports:
      - "${ASSEMBLY_HTTP_PORT:-8082}:${ASSEMBLY_HTTP_PORT:-8082}"
    environment:
      - KAFKA_BROKERS=kafka:${KAFKA_INTERNAL_PORT:-29092}
      - KAFKA_ORDER_PAID_TOPIC=order-paid
      - KAFKA_ORDER_PAID_GROUP_ID=assembly-group
      - KAFKA_SHIP_ASSEMBLED_TOPIC=ship-assembled
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - spaceship_network
    restart: unless-stopped

volumes:
  kafka_data:
  es_data:

networks:
  spaceship_network:
    name: spaceship_network
    external: false