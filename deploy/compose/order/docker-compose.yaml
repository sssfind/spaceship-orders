services:
  orders_db:
    image: postgres:17.0-alpine3.20
    container_name: orders_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    networks:
      - spaceship_network
    volumes:
      - orders_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  order_app:
    image: order:latest
    container_name: order_service
    build:
      context: ../../../
      dockerfile: deploy/docker/order/Dockerfile
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    env_file:
      - .env
    environment:
      KAFKA_SHIP_ASSEMBLED_GROUP_ID: "order-service-group"
    networks:
      - spaceship_network
    depends_on:
      orders_db:
        condition: service_healthy

volumes:
  orders_pg_data:

networks:
  spaceship_network:
    external: true
    name: spaceship_network